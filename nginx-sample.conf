upstream login_server {
	server 127.0.0.1:8081;
	keepalive 128;
}

server {
	listen 80;
	root /var/www/html;
	index index.php;
	server_name your-domain.com;

	# increase max file upload
	client_max_body_size 10M;

	# this is very important, be sure its in your nginx conf - it prevents access to logs etc.
	location ~ /system {
		deny all;
	}

	# block .htaccess, CHANGELOG.md, composer.json etc.
	# this is to prevent finding software versions
	location ~\.(ht|md|json|dist|sql)$ {
		deny all;
	}

	# block git files and folders
	location ~ /\.git {
		deny all;
	}

	location / {
		try_files $uri $uri/ /index.php?$query_string;
	}

	# Game client login JSON. Must be before the php regex.
	# cacheinfo / events / boosted creature stay on PHP (info.php).
	location = /login.php {
		proxy_http_version 1.1;
		proxy_set_header Connection "";
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_pass http://login_server;
		client_max_body_size 8k;
	}

	location ~ \.php$ {
		include snippets/fastcgi-php.conf;
		fastcgi_read_timeout 240;
		fastcgi_pass unix:/var/run/php/php7.4-fpm.sock;
		# for ubuntu 22.04+ it will be php8.1-fpm.sock
	}
}
