[package]
name = "login-server"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
anyhow = "1"
arc-swap = "1"
axum = "0.7"
base32 = "0.5"
base64 = "0.22"
chrono = "0.4"
dashmap = "6"
futures = "0.3"
hex = "0.4"
hmac = "0.12"
md-5 = "0.10"
mysql = "25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
opt-level = 3
strip = true
