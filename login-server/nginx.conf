# Do not include this file as a whole.
# Copy `upstream` into the `http` context and `location` into the site `server`
# block, before `location ~ \.php$`. See nginx-sample.conf for a full example.
# TLS stays on nginx. Only JSON type=login is served here; point the client
# info URL (cacheinfo, events, boosted creature) at PHP info.php.

# --- http context ---
upstream login_server {
	server 127.0.0.1:8081;
	keepalive 128;
}

# --- server context ---
location = /login.php {
	proxy_http_version 1.1;
	proxy_set_header Connection "";
	proxy_set_header Host $host;
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_pass http://login_server;
	client_max_body_size 8k;
}
